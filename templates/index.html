<!DOCTYPE html><html><body>
<h2>BugTracker - Python Flask SQL</h2>
<form action="/add" method="post">
<input name="title" placeholder="Bug Title" required>
<select name="priority"><option>High</option><option>Medium</option><option>Low</option></select>
<select name="status"><option>Open</option><option>Closed</option></select>
<button>Add</button>
</form>
<a href="/analytics">View SQL Analytics Dashboard</a>
<hr>
<table border="1">{% for b in bugs %}<tr><td>{{b['title']}}</td><td>{{b['priority']}}</td><td>{{b['status']}}</td><td><a href="/delete/{{b['id']}}">Del</a></td></tr>{% endfor %}</table>
</body></html>
